name: Ruby

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby 4.0
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true

    - name: Run all specs
      run: |
        bundle exec rspec --format=documentation

    - name: Run Rubocop
      run: |
        bundle exec rubocop

